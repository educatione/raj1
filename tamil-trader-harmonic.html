<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tamil Trader Harmonic</title>
<meta name="theme-color" content="#ffffff">
<meta name="description" content="Learn harmonic pattern trading in Tamil. Join the Telegram community. Trading involves risk.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=DM+Sans:wght@400;500;700&family=Noto+Sans+Tamil:wght@400;500;700&display=swap">
<style>
:root{color-scheme:light;--bg:#fff;--ink:#0f1c36;--muted:#5d6e8c;--tg:#2aabee;--grn:#22c997;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;display:flex;justify-content:center;align-items:center;text-align:center;color:var(--ink);font-family:"Noto Sans Tamil","DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
background:radial-gradient(ellipse 70% 40% at 50% 0%,rgba(42,171,238,.16),transparent 70%),radial-gradient(ellipse 70% 35% at 50% 100%,rgba(34,201,151,.08),transparent 70%),var(--bg)}
.wrap{position:relative;z-index:1;width:100%;max-width:460px;padding:30px 20px 24px;display:flex;flex-direction:column;align-items:center;gap:16px}
.ring{width:min(54vw,200px);aspect-ratio:1;border-radius:50%;padding:7px;background:conic-gradient(from 210deg,#1b6fb0,#8fdcff,#2aabee,#eaf8ff,#1b8ccf,#8fdcff,#1b6fb0);box-shadow:0 0 0 9px rgba(42,171,238,.1),0 0 0 10px rgba(42,171,238,.35),0 22px 50px rgba(42,171,238,.3)}
.ring .in{width:100%;height:100%;border-radius:50%;overflow:hidden;border:4px solid #fff;background:#0b1a12}
.ring img{width:100%;height:100%;object-fit:cover;display:block}
.bgc{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:700px;opacity:.2;pointer-events:none;z-index:0}
.bgc svg{display:block;width:100%;height:auto}
.chip{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;font-size:.85rem;font-weight:500;color:#1473a8;background:rgba(42,171,238,.1);border:1px solid rgba(42,171,238,.35)}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--grn);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,201,151,.6)}70%{box-shadow:0 0 0 8px rgba(34,201,151,0)}}
h1{margin:2px 0 0;font-family:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;font-weight:800;font-size:clamp(2.3rem,11vw,3.1rem);line-height:1.02;letter-spacing:-.02em;color:var(--ink);background:linear-gradient(180deg,#0f1c36 20%,#1b78b8);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.sub{margin:0;max-width:30ch;font-size:1rem;line-height:1.6;color:var(--muted)}

.ln{fill:none;stroke:#1b8ccf;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2.4s .3s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.pt{transform-box:fill-box;transform-origin:center;animation:pop .5s backwards}
@keyframes pop{from{opacity:0;transform:scale(.4)}}
.prz{animation:glow 2.2s 2.6s infinite}
@keyframes glow{50%{opacity:.45}}
.arr{stroke-dasharray:6 5;animation:fade .6s 2.7s backwards}
@keyframes fade{from{opacity:0}}

.join{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:14px;width:100%;padding:9px 22px 9px 11px;border-radius:999px;text-decoration:none;color:#fff;background:linear-gradient(180deg,#3bb9f5,#1b8ccf);box-shadow:0 12px 28px rgba(42,171,238,.4),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s,box-shadow .15s}
.join:hover{transform:translateY(-2px);box-shadow:0 16px 36px rgba(42,171,238,.55),inset 0 1px 0 rgba(255,255,255,.35)}
.join:active{transform:translateY(0)}
.join:focus-visible{outline:3px solid var(--ink);outline-offset:4px}
.join svg{width:54px;height:54px;flex:none;filter:drop-shadow(0 6px 6px rgba(10,60,110,.5))}
.lbl{display:flex;flex-direction:column;align-items:center;line-height:1.3}
.lbl b{font-size:1.08rem;font-weight:700}
.lbl em{font-style:normal;font-size:.84rem;font-weight:500;opacity:.92}
.join::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:38%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.4),transparent);transform:skewX(-20deg);animation:sheen 4.5s 2.5s infinite;pointer-events:none}
@keyframes sheen{0%,55%{left:-60%}100%{left:140%}}
.note{max-width:38ch;margin:2px 0 0;font-size:.76rem;line-height:1.6;color:var(--muted)}
@media (min-width:900px){.wrap{max-width:520px;gap:20px}.ring{width:210px}}
@media (prefers-reduced-motion:reduce){.ln{animation:none;stroke-dashoffset:0}.pt,.prz,.arr,.chip i{animation:none}.join{transition:none}.join::after{display:none}}
</style>
</head>
